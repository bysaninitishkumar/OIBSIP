<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>

    <style>

        body {
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            margin: 0;

            background: #f5f7fa;
        }


        .container {

            width: 420px;

            background: white;

            border-radius: 12px;

            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);

            padding: 24px;
        }


        h1 {

            margin-bottom: 20px;

            text-align: center;

            font-size: 26px;
        }


        .row {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 15px;
        }


        label {

            width: 110px;

            font-size: 14px;
        }


        select,
        input {

            flex: 1;

            padding: 10px;

            border-radius: 8px;

            border: 1px solid #cbd5e1;
        }


        button {

            padding: 10px 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background: #2563eb;

            color: white;
        }


        button:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        .status {

            line-height: 1.8;

            margin-bottom: 15px;
        }


        #message {

            font-weight: bold;

            font-size: 17px;

            min-height: 25px;
        }


        textarea {

            width: 100%;

            height: 130px;

            padding: 10px;

            box-sizing: border-box;

            resize: none;

            border-radius: 8px;

            border: 1px solid #cbd5e1;

            background: #f8fafc;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>Number Guessing Game</h1>


    <!-- Difficulty Selection -->

    <div class="row">

        <label for="difficulty">
            Difficulty
        </label>


        <select id="difficulty">

            <option value="EASY">
                Easy (1-50, 10 Attempts)
            </option>

            <option value="MEDIUM" selected>
                Medium (1-100, 7 Attempts)
            </option>

            <option value="HARD">
                Hard (1-200, 5 Attempts)
            </option>

        </select>

    </div>



    <!-- Guess Input -->


    <div class="row">

        <label for="guess">
            Your Guess
        </label>


        <input
                id="guess"
                type="number"
                placeholder="Enter Number">

    </div>



    <!-- Buttons -->


    <div class="row">

        <button id="submitGuess">

            Guess

        </button>


        <button id="playAgain">

            Play Again

        </button>


        <button id="hintButton">

            Hint

        </button>

    </div>



    <!-- Game Information -->


    <div class="status">

        <div id="roundInfo"></div>

        <div id="attemptInfo"></div>

        <div id="scoreInfo"></div>

        <div id="rangeInfo"></div>

        <div id="timerInfo"></div>

        <div id="streakInfo"></div>

        <div id="message"></div>

    </div>



    <!-- History -->


    <label>

        Round History

    </label>


    <textarea
            id="history"
            readonly>
    </textarea>


</div>



<script>


/* =========================

DIFFICULTY SETTINGS

========================= */


const difficulties = {


    EASY: {

        name: "Easy",

        maxNumber: 50,

        maxAttempts: 10
    },


    MEDIUM: {

        name: "Medium",

        maxNumber: 100,

        maxAttempts: 7
    },


    HARD: {

        name: "Hard",

        maxNumber: 200,

        maxAttempts: 5
    }

};



/* =========================

GAME VARIABLES

========================= */


let currentDifficulty = "MEDIUM";


let secretNumber;


let attempts = 0;


let round = 1;


let wins = 0;


let losses = 0;


let gameOver = false;


let roundHistory = [];


let currentStreak = 0;


let bestStreak = 0;


let timer = 0;


let timerInterval = null;


let minPossible = 1;


let maxPossible = difficulties[currentDifficulty].maxNumber;


let guesses = [];


let hintCount = 0;


const maxHints = 3;



/* =========================

HTML ELEMENTS

========================= */


const difficultySelect =

    document.getElementById("difficulty");


const guessInput =

    document.getElementById("guess");


const guessButton =

    document.getElementById("submitGuess");


const playAgainButton =

    document.getElementById("playAgain");


const hintButton =

    document.getElementById("hintButton");


const roundInfo =

    document.getElementById("roundInfo");


const attemptInfo =

    document.getElementById("attemptInfo");


const scoreInfo =

    document.getElementById("scoreInfo");


const rangeInfo =

    document.getElementById("rangeInfo");


const timerInfo =

    document.getElementById("timerInfo");


const streakInfo =

    document.getElementById("streakInfo");


const guessList =

    document.getElementById("guessList");


const message =

    document.getElementById("message");


const historyArea =

    document.getElementById("history");



/* =========================

START ROUND

========================= */


function startRound() {


    const difficulty =

        difficulties[currentDifficulty];


    attempts = 0;


    gameOver = false;



    secretNumber =

        Math.floor(

            Math.random() *

            difficulty.maxNumber

        ) + 1;



    /*
    DEBUGGING

    Press F12 → Console

    You can see the secret number.
    */


    console.log(

        "Secret Number:",

        secretNumber
    );



    roundInfo.textContent =

        "Round: " +

        round +

        " | Difficulty: " +

        difficulty.name;



    attemptInfo.textContent =

        "Attempts: 0 / " +

        difficulty.maxAttempts;



    scoreInfo.textContent =

        "Wins: " +

        wins +

        " | Losses: " +

        losses;



    setMessage(

        "Guess a number between 1 and " +

        difficulty.maxNumber

    );



    guessInput.value = "";


    guessInput.disabled = false;


    guessButton.disabled = false;


    hintButton.disabled = false;


    guessInput.focus();


    startTimer();


    updateHistory();

}



/* =========================

CHECK GUESS

========================= */


function checkGuess() {


    if (gameOver) {

        return;
    }



    const difficulty =

        difficulties[currentDifficulty];



    const input =

        guessInput.value.trim();



    /* EMPTY INPUT */


    if (input === "") {


        setMessage(

            "Please enter a number.",

            true

        );


        return;
    }



    const guess = Number(input);



    /* INVALID NUMBER */


    if (

        !Number.isInteger(guess) ||

        guess < 1 ||

        guess > difficulty.maxNumber

    ) {


        setMessage(

            "Enter a whole number between 1 and " +

            difficulty.maxNumber +

            ".",

            true
        );


        return;
    }



    /* COUNT ATTEMPT */


    attempts++;



    attemptInfo.textContent =

        "Attempts: " +

        attempts +

        " / " +

        difficulty.maxAttempts;



    /*
    IMPORTANT COMPARISON LOGIC
    */


    if (guess === secretNumber) {


        winGame();


        return;
    }



    if (guess < secretNumber) {


        setMessage("Too Low!");
        minPossible = Math.max(minPossible, guess + 1);


    }


    else if (guess > secretNumber) {


        setMessage("Too High!");
        maxPossible = Math.min(maxPossible, guess - 1);

    }

    guesses.push(guess);
    updateGuessList();
    updateRangeInfo();
    updateHintButton();

    if (

        attempts >=

        difficulty.maxAttempts

    ) {


        loseGame();

    }



    guessInput.value = "";


    guessInput.focus();

}
function winGame() {


    gameOver = true;


    wins++;
    roundHistory.push(

        "Round " +

        round +

        " - " +

        difficulties[currentDifficulty].name +

        " - Guessed in " +

        attempts +

        " attempts (WIN)"

    );



    setMessage(

        "Correct! You guessed the number " +

        secretNumber +

        " in " +

        attempts +

        " attempts."

    );



    finishRound();

}
function loseGame() {


    gameOver = true;


    losses++;



    roundHistory.push(

        "Round " +

        round +

        " - " +

        difficulties[currentDifficulty].name +

        " - Lost (Secret Number: " +

        secretNumber +

        ")"

    );
    setMessage(

        "You Lost! The correct number was " +

        secretNumber +

        ".",

        true

    );
    finishRound();

}
function finishRound() {


    stopTimer();


    guessInput.disabled = true;


    guessButton.disabled = true;


    hintButton.disabled = true;
    scoreInfo.textContent =

        "Wins: " +

        wins +

        " | Losses: " +

        losses;


    updateHistory();

}


function updateHintButton() {
    hintButton.disabled = gameOver || hintCount >= maxHints;
    hintButton.textContent =
        "Hint (" +
        (maxHints - hintCount) +
        " left)";
}


function updateGuessList() {
    guessList.textContent = guesses.length ? guesses.join(", ") : "none";
}


function updateRangeInfo() {
    rangeInfo.textContent = "Possible range: " + minPossible + " - " + maxPossible;
}


function getHint() {
    if (gameOver || hintCount >= maxHints) {
        return;
    }

    hintCount++;
    let hintText = "";

    if (hintCount === 1) {
        hintText = secretNumber % 2 === 0 ? "The number is even." : "The number is odd.";
    } else if (hintCount === 2) {
        const low = Math.max(minPossible, secretNumber - 5);
        const high = Math.min(maxPossible, secretNumber + 5);
        hintText = "The secret number is between " + low + " and " + high + ".";
    } else {
        if (secretNumber % 3 === 0) {
            hintText = "The number is a multiple of 3.";
        } else if (secretNumber % 5 === 0) {
            hintText = "The number is a multiple of 5.";
        } else {
            hintText = "The number is not a multiple of 3 or 5.";
        }
    }

    setMessage("Hint: " + hintText);
    updateHintButton();
}


function updateTimerDisplay() {
    timerInfo.textContent = "Time elapsed: " + timer + " sec";
}


function startTimer() {
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {
        timer++;
        updateTimerDisplay();
    }, 1000);
}


function stopTimer() {
    clearInterval(timerInterval);
}


function updateStreakInfo() {
    streakInfo.textContent = "Win streak: " + currentStreak + " | Best streak: " + bestStreak;
}


function setMessage(

    text,

    error = false

) {


    message.textContent = text;


    if (error) {


        message.style.color = "#dc2626";


    }

    else {


        message.style.color = "#111827";

    }

}



/* =========================

UPDATE HISTORY

========================= */


function updateHistory() {


    historyArea.value =

        roundHistory.join("\n");

}



/* =========================

GUESS BUTTON

========================= */


guessButton.addEventListener(

    "click",

    checkGuess

);



/* =========================

ENTER KEY SUPPORT

========================= */


guessInput.addEventListener(

    "keydown",

    function(event) {


        if (event.key === "Enter") {


            checkGuess();

        }

    }

);

playAgainButton.addEventListener(

    "click",

    function() {


        round++;
        startRound();
    }
);
difficultySelect.addEventListener(

    "change",

    function() {


        currentDifficulty =

            difficultySelect.value;


        round++;


        startRound();

    }

);



/* =========================

START APPLICATION

========================= */


startRound();


</script>


</body>

</html>
